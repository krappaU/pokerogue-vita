# SPDX-License-Identifier: AGPL-3.0-only
# Publishes a release for players when a version tag (v0.69-beta, v1.0) is pushed: the player .vpk
# from a passed CI run of the tagged commit (the file CI checked in Vita3K), with
# docs/releases/<tag>.md as the notes. Tag a commit of main whose CI passed, or is still running.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag, version and notes
        run: |
          version=$(cat runtime/VERSION)
          [[ "$TAG" == "v$version" || "$TAG" == "v$version-"* ]] || { echo "tag $TAG doesn't match runtime/VERSION ($version)"; exit 1; }
          [ -f "docs/releases/$TAG.md" ] || { echo "no docs/releases/$TAG.md"; exit 1; }
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Wait for a passed CI run of the commit
        run: |
          for _ in $(seq 100); do
            run=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId -q '.[0].databaseId')
            if [ -n "$run" ]; then echo "RUN=$run" >> "$GITHUB_ENV"; exit 0; fi
            busy=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json status -q '[.[] | select(.status != "completed")] | length')
            [ "$busy" -gt 0 ] || { echo "no passed or running CI run for $GITHUB_SHA"; exit 1; }
            sleep 30
          done
          echo "CI didn't finish in time"; exit 1
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}
          name: pokerogue-${{ env.VERSION }}-${{ github.sha }}
          path: dl
      - name: Publish
        run: |
          vpk="dl/pokerogue-$VERSION.vpk"
          [ -f "$vpk" ] || { echo "run $RUN has no $vpk"; exit 1; }
          title="PokeRogue Vita $VERSION"
          case "$TAG" in *-beta) title="$title (beta)" ;; *-alpha) title="$title (alpha)" ;; esac
          gh release create "$TAG" "$vpk" --verify-tag --title "$title" --notes-file "docs/releases/$TAG.md"
