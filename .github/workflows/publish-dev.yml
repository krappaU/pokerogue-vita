# SPDX-License-Identifier: AGPL-3.0-only
# Publishes a CI run's dev .vpk as the "dev-build" pre-release, which dev builds on the console
# check at start (runtime/src/devtools.c). Runs by itself after every green CI run of a push to
# main (the commit title is the label), and by hand (Actions -> Publish dev build -> Run) for
# another run: publishing an older run again is a rollback. Other branches are never published.
name: Publish dev build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      label:
        description: What to test (shown on the console)
        required: false
      run:
        description: CI run id or URL (empty = the newest successful CI run on main)
        required: false

concurrency:
  group: publish-dev

permissions:
  contents: write
  actions: read

jobs:
  publish:
    # By hand, or a CI run of a push to main that passed (not pull requests, not failures).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_INPUT: ${{ inputs.run || github.event.workflow_run.id }}
      LABEL: ${{ inputs.label || github.event.workflow_run.head_commit.message }}
    steps:
      - name: Find the CI run
        run: |
          run=$(grep -oE '[0-9]{6,}' <<< "$RUN_INPUT" | tail -1 || true)
          if [ -z "$run" ]; then
            run=$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          [ -n "$run" ] || { echo "no successful CI run found"; exit 1; }
          gh run view "$run" --json headSha,headBranch,displayTitle > run.json
          echo "RUN=$run" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}
          pattern: pokerogue-dev-*
          path: dl
          merge-multiple: true
      - name: Publish
        run: |
          vpk=$(ls dl/pokerogue-*-dev.vpk | head -1)
          [ -f "$vpk" ] || { echo "run $RUN has no dev .vpk (expired?)"; exit 1; }
          version=$(basename "$vpk" | sed -E 's/pokerogue-(.*)-dev\.vpk/\1/')
          asset="pokerogue-$version-dev-run$RUN.vpk"
          mv "$vpk" "$asset"
          sha=$(jq -r .headSha run.json)
          # The console's JSON reader has no escapes: plain printable ASCII, no quotes or backslashes.
          python3 - "$asset" "$version" "$sha" "$RUN" > build.json <<'EOF'
          import json, os, re, sys
          asset, version, sha, run = sys.argv[1:]
          b = json.load(open("run.json"))
          label = f"{version} {b['headBranch']} {sha[:7]}"
          if os.environ.get("LABEL", "").strip():
              label += " - " + os.environ["LABEL"].strip().splitlines()[0]  # a commit message: its title
          label = re.sub(r"[^ -~]", "?", label).replace('"', "'").replace("\\", "/")[:150]
          url = f"https://github.com/{os.environ['GH_REPO']}/releases/download/dev-build/{asset}"
          print(json.dumps({"id": f"run{run}", "commit": sha[:7], "label": label,
                            "size": os.path.getsize(asset), "url": url}))
          EOF
          cat build.json
          notes="Test build for the developer's console, not for players: install a release instead.
          Install it once with VitaShell; from 0.58 on, a dev build installs new test builds by itself.
          $(jq -r .label build.json)
          From CI run https://github.com/$GH_REPO/actions/runs/$RUN"
          # A new release each time: the tag moves to the build's commit, and the old .vpk is gone.
          # The .vpk goes up before build.json, so a console never sees a build.json without it.
          gh release delete dev-build --cleanup-tag --yes 2>/dev/null || true
          gh release create dev-build "$asset" --prerelease --target "$sha" --title "Dev build $version" --notes "$notes"
          gh release upload dev-build build.json
